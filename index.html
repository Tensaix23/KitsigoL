.paper{background:#fff;color:#111;border:1px solid #cfd3d9;border-radius:6px;padding:18px;font-size:12.5px;line-height:1.45}

.path{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@media (max-width:900px){

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function abcMap(){const s=[...S.skus].sort((a,b)=>b.vel-a.vel);const tot=s.reduce((t,x)=>t+x.vel,0);let c=0;const m={};s.forEach(x=>{const p=c/tot;m[x.sku]=p<.8?'A':p<.95?'B':'C';c+=x.vel});return m}
const abcShare=()=>{const tot=S.skus.reduce((t,x)=>t+x.vel,0);const s=[...S.skus].sort((a,b)=>b.vel-a.vel);let c=0;const m={};s.forEach(x=>{c+=x.vel;m[x.sku]={share:x.vel/tot,cum:c/tot}});return m};
function idealZone(sk){return(sk.w>=20||sk.vol>=100)?'R':abcMap()[sk.sku]}
function usage(locId,ignore){let v=0,k=0;for(const r of S.stock){if(r.loc!==locId||r.id===ignore)continue;const s=skuOf(r.sku);v+=r.qty*s.vol;k+=r.qty*s.w}return{v,k}}
function reasonFor(sk,l){const ab=abcMap()[sk.sku];const ideal=idealZone(sk);
 let t=ideal==='R'?'Pesado o voluminoso → reserva':`Rotación ${ab} → zona ${ideal}`;
 if(l.z!==ideal)t+=` (sin espacio: zona ${l.z})`;
 if(sk.w>=5&&l.l===1)t+=', nivel bajo por peso';
 if(S.stock.some(r=>r.loc===l.id&&r.sku===sk.sku))t+=', consolida con mismo SKU';
 return t}
function suggestLoc(sk,units=1,ignore){
 const pref={A:['A','B','C','R'],B:['B','A','C','R'],C:['C','B','A','R'],R:['R','C','B','A']}[idealZone(sk)];
 let best=null;
 for(const l of S.locs){if(l.z==='Q')continue;const zi=pref.indexOf(l.z);if(zi<0)continue;
  if(S.stock.some(r=>r.loc===l.id&&r.id!==ignore&&r.sku!==sk.sku&&r.qty>0))continue;
  const u=usage(l.id,ignore);const fit=Math.floor(Math.min((l.vol-u.v)/sk.vol,(l.kg-u.k)/sk.w));if(fit<units)continue;
  const same=S.stock.some(r=>r.loc===l.id&&r.sku===sk.sku&&r.id!==ignore)?-50:0;
  const score=zi*100+(l.l-1)*(sk.w>=5?30:5)+l.a*4+l.b+same;
  if(!best||score<best.score)best={loc:l,fit,score}}
 return best}
function placeQty(sk,qty,lot,exp,serials,ref,type='Ingreso',status='ok'){
 const out=[];let rem=qty;const ser=[...serials];
 while(rem>0){const s=suggestLoc(sk,1);let loc,n;
  if(s){loc=s.loc;n=Math.min(rem,s.fit)}else{loc=MUELLE;n=rem}
  const sers=ser.splice(0,n);
  let row=S.stock.find(r=>r.sku===sk.sku&&r.lot===lot&&r.exp===exp&&r.loc===loc.id&&r.status===status);
  if(row){row.qty+=n;row.serials.push(...sers)}else{row={id:'ST'+(S.seq.st++),sku:sk.sku,lot,exp,qty:n,res:0,loc:loc.id,serials:sers,status};S.stock.push(row)}
  mov(type,sk.sku,lot,n,loc.id,ref);
  out.push({row,loc,n,reason:s?reasonFor(sk,loc):'Sin ubicación libre: queda en muelle'});rem-=n}
 return out}

function allocate(orders){
 const allocs=[],failed=[];const temp=new Map();
 for(const o of orders){const mine=[];let ok=true;
  for(const ln of o.lines){let need=ln.qty;
   const rows=S.stock.filter(r=>r.sku===ln.sku&&r.status==='ok').sort((a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999')||a.lot.localeCompare(b.lot));
   for(const r of rows){const free=r.qty-r.res-(temp.get(r.id)||0);if(free<=0)continue;const t=Math.min(free,need);mine.push({order:o.id,sku:ln.sku,stockId:r.id,qty:t});temp.set(r.id,(temp.get(r.id)||0)+t);need-=t;if(!need)break}

  if(ok)allocs.push(...mine);else{failed.push(o.id);mine.forEach(m=>temp.set(m.stockId,temp.get(m.stockId)-m.qty))}}
 return{allocs,failed}}

 if(sk.per&&(!f.exp||daysTo(f.exp)<30))return['merma','Vida útil restante menor a 30 días: no se reingresa.'];

  {k:'cost',label:'Costo unitario (CLP)',type:'number',req:1,min:0,val:s?.cost},

 +`<div class="row" style="justify-content:space-between;align-items:center"><div class="seg" role="tablist" aria-label="Tablas">${MT.map(([k,l])=>`<button data-act="m-tab" data-t="${k}" aria-pressed="${t===k}">${l} <span class="muted mono">${mcount(k)}</span></button>`).join('')}</div><button class="btn" data-act="m-new">${MNEW[t]}</button></div>`
 +`<section class="panel"><div class="ph"><div class="row" style="flex:1;align-items:center"><input class="in" id="mq" data-in="mq" style="max-width:300px" placeholder="Buscar" value="${esc(U.mst.q)}" aria-label="Buscar"><span class="sub">${MHELP[t]}</span></div></div><div class="pb flush scroll" id="mtbl">${mTable()}</div></section>`}
NAV.push({id:'maestros',t:'Datos maestros',g:'Configuración'});
A['m-tab']=el=>{U.mst.tab=el.dataset.t;U.mst.q='';render()};
A['m-new']=()=>({sku:()=>skuForm(),prov:()=>provForm(),cust:()=>custForm(),car:()=>carForm(),veh:()=>vehForm()})[U.mst.tab]();
A['m-edit']=el=>{const id=el.dataset.id;({sku:()=>skuForm(skuOf(id)),prov:()=>provForm(S.provs.find(p=>p.id===id)),cust:()=>custForm(id),car:()=>carForm(S.carriers.find(c=>c.id===id)),veh:()=>vehForm(S.vehicles.find(v=>v.id===id))})[el.dataset.t]()};
A['m-del']=el=>{if(!el.dataset.arm){el.dataset.arm='1';el.textContent='¿Eliminar?';setTimeout(()=>{el.dataset.arm='';el.textContent='Eliminar'},3500);return}
 const t=el.dataset.t,id=el.dataset.id;let why='';
 if(t==='sku'){if(onHand(id)>0)why='tiene stock';else if(S.orders.some(o=>o.lines.some(l=>l.sku===id))||S.asn.some(a=>a.lines.some(l=>l.sku===id))||S.returns.some(r=>r.sku===id))why='está en pedidos, órdenes o devoluciones';else S.skus=S.skus.filter(s=>s.sku!==id)}
 if(t==='prov'){const p=S.provs.find(x=>x.id===id);if(S.asn.some(a=>a.prov===p.name&&a.status==='Pendiente'))why='tiene órdenes pendientes';else S.provs=S.provs.filter(x=>x!==p)}
 if(t==='cust'){if(S.orders.some(o=>o.cust===id))why='tiene pedidos asociados';else delete S.cust[id]}
 if(t==='car'){if(S.vehicles.some(v=>v.carrier===id))why='tiene vehículos asociados';else S.carriers=S.carriers.filter(c=>c.id!==id)}
 if(t==='veh'){if(S.routes.some(r=>r.veh===id&&r.status!=='Cerrada'))why='está asignado a una ruta';else S.vehicles=S.vehicles.filter(v=>v.id!==id)}
 toast(why?`No se puede eliminar: ${why}`:'Registro eliminado');render()};
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.chg==='fm-com'){const c=COMUNAS[e.target.value];if(c){$('#fm-x').value=c[0];$('#fm-y').value=c[1]}}});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.in==='mq'){U.mst.q=e.target.value;$('#mtbl').innerHTML=mTable()}});

/* --- Ajuste de stock y movimiento manual (dentro de la traza del lote) --- */
const _traza=A.traza;
A.traza=el=>{_traza(el);const r=S.stock.find(x=>x.id===el.dataset.id);if(!r)return;const sk=skuOf(r.sku);
 const dests=S.locs.filter(l=>l.z!=='Q'&&l.id!==r.loc).filter(l=>{if(S.stock.some(x=>x.loc===l.id&&x.sku!==r.sku&&x.qty>0))return false;const u=usage(l.id);return Math.min((l.vol-u.v)/sk.vol,(l.kg-u.k)/sk.w)>=r.qty}).sort((a,b)=>pathKey(a.id)-pathKey(b.id)).slice(0,40);
 $('#ov .mb .stack').insertAdjacentHTML('beforeend',`<div class="grid2"><div class="panel" style="box-shadow:none"><div class="ph"><h2>Ajustar cantidad</h2></div><div class="pb stack">${r.serials.length?'<div class="note">Los productos con serie se ajustan con ingreso o devolución, para no perder la trazabilidad.</div>':`<div class="row"><label class="f" style="width:120px"><span>Cantidad real</span><input class="in" id="adj-qty" type="number" min="${r.res}" value="${r.qty}"></label><label class="f" style="flex:1;min-width:150px"><span>Motivo</span><select class="in" id="adj-why"><option>Conteo cíclico</option><option>Corrección de ingreso</option><option>Pérdida o rotura</option></select></label></div><div><button class="btn sm" data-act="adj-ok" data-id="${r.id}">Aplicar ajuste</button></div>`}</div></div>
 <div class="panel" style="box-shadow:none"><div class="ph"><h2>Mover de ubicación</h2></div><div class="pb stack">${dests.length?`<label class="f"><span>Destino (con espacio suficiente)</span><select class="in" id="mov-loc">${dests.map(l=>`<option value="${l.id}">${l.id} · ${ZSHORT[l.z]}${l.z===idealZone(sk)?' (zona ideal)':''}</option>`).join('')}</select></label><div><button class="btn sm" data-act="mov-ok" data-id="${r.id}">Mover lote</button></div>`:'<div class="note">No hay ubicaciones libres con capacidad para este lote.</div>'}</div></div></div>`)};
A['adj-ok']=el=>{const r=S.stock.find(x=>x.id===el.dataset.id);const n=Math.floor(+$('#adj-qty').value);if(!(n>=r.res)){toast(`La cantidad no puede ser menor al reservado (${r.res})`);return}
 const d=n-r.qty;if(!d){toast('Sin cambios');return}r.qty=n;mov('Ajuste',r.sku,r.lot,d,r.loc,$('#adj-why').value);if(r.qty===0&&r.res===0)S.stock=S.stock.filter(x=>x!==r);closeModal();toast(`Ajuste aplicado (${d>0?'+':''}${d})`);render()};
A['mov-ok']=el=>{const r=S.stock.find(x=>x.id===el.dataset.id);const from=r.loc;r.loc=$('#mov-loc').value;mov('Reubicación',r.sku,r.lot,r.qty,r.loc,`${from} → ${r.loc} (manual)`);
 const tw=S.stock.find(x=>x!==r&&x.sku===r.sku&&x.lot===r.lot&&x.exp===r.exp&&x.loc===r.loc&&x.status===r.status);if(tw){tw.qty+=r.qty;tw.res+=r.res;tw.serials.push(...r.serials);S.stock=S.stock.filter(x=>x!==r)}
 closeModal();toast('Lote movido');render()};

document.addEventListener('click',e=>{
 if(e.target.dataset&&e.target.dataset.bg){closeModal();return}
 const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;
 if(act==='close'){closeModal();return}
 if(act==='go'){closeModal();go(el.dataset.v);return}
 if(act==='theme'){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';return}
 if(act==='reset'){if(el.dataset.arm){seed();U.rec={open:null,result:null};U.pick={sel:new Set(),strat:'wave'};U.pack={order:null,scan:{},box:null,real:'',made:null};U.ret={};render();toast('Datos de ejemplo restablecidos')}else{el.dataset.arm='1';el.textContent='Pulse otra vez para confirmar';setTimeout(()=>{el.dataset.arm='';el.textContent='Restablecer datos de ejemplo'},4000)}return}
 if(A[act])A[act](el,e)});
document.addEventListener('change',e=>{const el=e.target;const c=el.dataset&&el.dataset.chg;if(!c)return;
 if(c==='vel'){skuOf(el.dataset.id).vel=Math.max(1,+el.value||1);render()}
 else if(c==='pack-box'){U.pack.box=el.value;render()}
 else if(c==='rf'){const f=U.ret.f,k=el.dataset.k;f[k]=el.type==='checkbox'?el.checked:el.value;if(k==='order'){const o=S.orders.find(x=>x.id===f.order);f.sku=o.lines[0].sku;f.serial='';f.qty=1}if(k==='sku'){f.serial='';f.qty=1}render()}
 else if(c==='assign'&&el.value){const o=S.orders.find(x=>x.id===el.dataset.id);const[t,id]=el.value.split(':');let r=t==='R'?S.routes.find(x=>x.id===id):newRoute(id);
  if(!fits(r,o)){toast('El pedido excede la capacidad del vehículo');if(t==='V'){S.routes=S.routes.filter(x=>x!==r)}render();return}
  r.orders.push(o.id);o.route=r.id;sequence(r);render()}});
function refreshPack(){const o=S.orders.find(x=>x.id===U.pack.order);if(!o)return;const ws=weightState(o);const w=$('#wstate');if(!w)return;
 w.innerHTML=`<div class="note ${ws.r==null?'':ws.ok?'ok':'bad'}">${ws.txt}</div>${ws.r!=null&&!ws.ok?`<label class="chk" style="padding:8px 0 0;border:0"><input type="checkbox" data-act="pack-auth" ${U.pack.auth?'checked':''}><span>Supervisor autoriza el despacho con esta diferencia</span></label>`:''}`;
 const b=$('#packmake');if(b)b.disabled=!(scanned(o)&&(ws.ok||(ws.r!=null&&U.pack.auth)))}
document.addEventListener('input',e=>{const el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;
 if(k==='invq'){U.inv.q=el.value;$('#invtbl').innerHTML=invTable();$('#invser').innerHTML=serialTrace()}
 else if(k==='real'){U.pack.real=el.value;refreshPack()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='scanin'){const v=e.target.value.trim().toUpperCase();const o=S.orders.find(x=>x.id===U.pack.order);const l=o.lines.find(x=>x.sku===v||x.sku==='SKU-'+v);
 if(!l){toast('Ese SKU no pertenece al pedido');e.target.select();return}
 if((U.pack.scan[l.sku]||0)>=l.qty){toast('Cantidad ya completa para '+l.sku);e.target.select();return}
 U.pack.scan[l.sku]=(U.pack.scan[l.sku]||0)+1;render();const i=$('#scanin');if(i)i.focus()}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.g){try{localStorage.setItem('g-'+d.dataset.g,d.open?'1':'0')}catch(x){}}},true);

A['db-reload']=async()=>{try{const r=await WMSDB.pull();if(r){S=r;migrate();WMSDB.baseline(S)}DBS=WMSDB.status;render();toast('Datos actualizados desde la base de datos')}catch(e){toast('No se pudo conectar con la base de datos')}};
(async function boot(){
 let remote=null,dbok=false;
 if(window.WMSDB){$('#view').innerHTML='<div class="empty">Conectando con la base de datos…</div>';
  try{remote=await WMSDB.pull();dbok=true}catch(e){}
  WMSDB.onStatus(s=>{DBS=s;renderNav();if(s==='conflict')toast('Otro usuario guardó cambios antes. Cargue los datos actualizados.')})}
 if(remote){S=remote;migrate()}else if(!load())seed();
 S.notes.forEach(n=>{if(n.status==='Sincronizando')n.status='Pendiente'});
 if(dbok){DBON=true;DBS=WMSDB.status;if(remote)WMSDB.baseline(S);else save()}
 else if(window.WMSDB){toast('Sin conexión con la base de datos: se usan datos locales')}
 {const h=location.hash.slice(1);if(VIEWS[h])U.view=h}
 window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==U.view){U.view=h;render()}});
 render();
})();
